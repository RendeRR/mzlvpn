name: Build Mozilla VPN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  NDK_VERSION: 27.0.12077973
  RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"

      - name: Test Go core
        working-directory: core
        env:
          # The race detector needs cgo; the runner's gcc covers it
          # (verified locally: the full suite passes under -race).
          CGO_ENABLED: "1"
        run: |
          go mod tidy
          go vet ./...
          go test -race ./...

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android NDK & gomobile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"

      - name: Refresh geoip database (fallback to committed copy)
        run: |
          # Fresh prefix zones in every build: the APK ships a current
          # database. ipdeny is a third-party source, so a failure here
          # (network, bad data, failed sanity checks in the script)
          # must NOT fail the build: roll the data files back to the
          # committed copy and carry on with a warning.
          if python3 core/geoip/fetch_data.py > /tmp/geoip-fetch.log 2>&1; then
            cat /tmp/geoip-fetch.log
            git diff --stat -- core/geoip/data | tail -3 || true
            total=$(grep '^total:' /tmp/geoip-fetch.log | awk '{print $2}')
            echo "::notice title=geoip::database refreshed from ipdeny ($total prefixes)"
          else
            echo "::warning title=geoip::refresh failed, building with the committed database"
            cat /tmp/geoip-fetch.log || true
            git checkout -- core/geoip/data
          fi

      - name: Compile Optimized Go Core (core.aar)
        run: |
          mkdir -p android/app/libs
          cd core
          go get -tool "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          go get "golang.org/x/mobile/bind@$GOMOBILE_VERSION"
          go mod tidy
          gomobile bind -target=android -androidapi 24 -trimpath -ldflags "-s -w" \
            -o ../android/app/libs/core.aar ./mobile

      - name: Build Release APKs (universal + arm64-v8a, consistent signature)
        working-directory: android
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > app/release.p12
          gradle assembleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-universal-release.apk ../out/Mozilla-VPN-universal.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../out/Mozilla-VPN-arm64-v8a.apk

      - name: Upload Ready Android APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mozilla-VPN-Android-APKs
          path: out/*.apk
          if-no-files-found: error

      - name: Create or Update Latest GitHub Release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if [ -f "release-notes-$version.md" ]; then
            # Per-version release notes committed with the release;
            # versions without such a file get the generic text below.
            cp "release-notes-$version.md" release-notes.md
          else
          cat > release-notes.md <<'EOF'
          Неофициальный лёгкий Android-клиент Mozilla VPN / Firefox Private Network.
          Нативный Kotlin + Jetpack Compose, сетевое ядро на Go.

          ## Какой файл качать

          - **Mozilla-VPN-arm64-v8a.apk** — для современных 64-битных телефонов
            (Google Pixel и почти все Android последних лет): меньше размер.
          - **Mozilla-VPN-universal.apk** — для любого устройства: все
            архитектуры в одном файле.

          Подпись постоянная: новые версии устанавливаются поверх старых без удаления.

          ---

          Unofficial lightweight Android client for Mozilla VPN / Firefox Private
          Network. Native Kotlin + Jetpack Compose with a Go networking core.
          Requires a Mozilla account with VPN/FPN access; not affiliated with Mozilla.
          EOF
          fi
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.apk \
            --title "Mozilla VPN $version" \
            --notes-file release-notes.md
            
